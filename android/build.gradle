allprojects {
    repositories {
        google()
        mavenCentral()
    }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                    compileSdk = 37
                }
                // Plugins that reference BuildConfig.* at compile time but don't opt-in
                // via their own buildFeatures block. Required since AGP 8 no longer
                // generates BuildConfig by default.
                if (project.name in ['sentry_flutter', 'url_launcher_android']) {
                    project.android.buildFeatures.buildConfig = true
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
