plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
   if (keystorePropertiesFile.exists()) {
       keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
   }

   android {

    ndkVersion = "26.3.11579264"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
    }

    defaultConfig {
        applicationId "com.mysteriumvpn.android"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true

        ndk.abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'

        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"
    }

       flavorDimensions "env"
       productFlavors {
           create("dev") {
               dimension "env"
               applicationIdSuffix ".test"
               manifestPlaceholders = [ "appLabel": "Mysterium VPN Test"]
               matchingFallbacks = ['release'] // Inherit from release build type
           }
       create("prod") {
               dimension "env"
               manifestPlaceholders = [ "appLabel": "Mysterium VPN"]
           }
       }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }
   buildTypes {
       release {
           signingConfig signingConfigs.release
       }
   }
       testBuildType "release"
       namespace 'com.mysteriumvpn.android'

   }

dependencies {
    androidTestUtil "androidx.test:orchestrator:1.5.1"
}

flutter {
    source '../..'
}


