name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:

  quality_checks:
    name: Quality Checks (Lint, Test, Build Check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate
        run: flutter packages pub run build_runner build --delete-conflicting-outputs
      - run: git status

      # 1. Static Analysis (Linting)
      - name: Run Flutter Analyze (Lint)
        run: flutter analyze

      # 2. Run Unit Tests
      - name: Run Flutter Unit Tests
        run: flutter test

      # 3. Build Check (Linux, fast and cheap)
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev
      - name: Build Check
        run: flutter build linux --no-pub --debug --dart-define FLAVOR=DEV
