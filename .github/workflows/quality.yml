name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:

  quality_checks:
    name: Quality Checks (Lint, Test, Build Check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate
        run: |
          flutter packages pub run build_runner build --delete-conflicting-outputs
          git status

      - name: Run Flutter Analyze (Lint)
        run: flutter analyze

      - name: Run Flutter Unit Tests
        run: flutter test

      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev
      - name: Build Check (Linux, fast and cheap)
        run: flutter build linux --no-pub --debug --dart-define FLAVOR=DEV

  prebuilt_ios:
    name: Prebuild Check (iOS)
    needs: [quality_checks]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-12, macos-14]
    # Allow macOS 12 to fail without stopping the entire workflow
    continue-on-error: ${{ matrix.os == 'macos-12' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate
        run: |
          flutter packages pub run build_runner build --delete-conflicting-outputs
          git status

      - name: Install Pods
        run: pod install
        working-directory: ios

      - name: Build
        run: flutter build ios --no-pub --debug --no-codesign --flavor "dev" --dart-define FLAVOR=DEV