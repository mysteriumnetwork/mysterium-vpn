name: Quality Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:

  quality_checks:
    name: Quality Checks (Lint, Test, Build Check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate
        run: |
          flutter packages pub run build_runner build --delete-conflicting-outputs
          git status

      - name: Run Flutter Analyze (Lint)
        run: flutter analyze

      - name: Run Flutter Unit Tests
        run: flutter test

      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev
      - name: Build Check (Linux, fast and cheap)
        run: flutter build linux --no-pub --debug --dart-define FLAVOR=DEV

  build_ios:
    name: Publish iOS app to TestFlight
    needs: [quality_checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_build-ios.yml
    secrets: inherit

  build_macos:
    name: Publish macOS app to TestFlight
    needs: [quality_checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_build-macos.yml
    secrets: inherit

  build_android:
    name: Publish Android app to Internal Testing
    needs: [quality_checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_build-android.yml
    secrets: inherit