name: Auto Assign Task
on:
  push:
jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Get the column ID
        run: |
          gh api graphql -f query='{
            organization(login: "mysteriumnetwork") {
              projectV2(number: 28) {
                fields(first: 100) {
                  nodes {
                    ... on ProjectV2FieldCommon {
                    name
                    }
                    ... on ProjectV2SingleSelectField {
                    name
                    options {
                      id
                      name
                      }
                    }
                    ... on ProjectV2IterationField {
                      name
                      configuration {
                        duration
                        iterations {
                          id
                          startDate
                          title
                          }
                        }
                      }
                    }
                  }
                }
              }
            }'
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECTS_RO_TOKEN }}
