name: Auto Assign Task
on:
  push:
jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Get the column ID
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/projects/28/columns
