name: Integration Tests

on:
  release:
    types: [ created ]
  workflow_dispatch:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
        default: "dev"
      flavor_dart:
        required: true
        type: string
        default: "DEV"

jobs:
  integration_tests:
    name: Run Integration Tests
    runs-on: macos-15

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Materialize .env files from repo secrets
        shell: bash
        env:
          ENV_DEV: ${{ secrets.ENV_DEV }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ENV_E2E: ${{ secrets.ENV_E2E }}
        run: bash .github/scripts/materialize-envs.sh

      - name: Set up Google Cloud SDK
        uses: 'google-github-actions/auth@v3'
        with:
          project_id: 'new-mysterium-vpn'
          workload_identity_provider: 'projects/104590535697/locations/global/workloadIdentityPools/github/providers/mysterium-repo'
          service_account: 'github-actions-service-account@new-mysterium-vpn.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      - name: Setup Flutter Version Management CLI
        uses: kuhnroyal/flutter-fvm-config-action/setup@v3

      - name: Verify Flutter and Dart
        run: |
          flutter --version
          dart --version

      - name: Set up fake FVM alias
        run: |
          mkdir -p ~/.local/bin
          echo '#!/bin/bash' > ~/.local/bin/fvm
          echo 'if [[ "$1" == "flutter" || "$1" == "dart" ]]; then' >> ~/.local/bin/fvm
          echo '  cmd=$1' >> ~/.local/bin/fvm
          echo '  shift' >> ~/.local/bin/fvm
          echo '  exec "$cmd" "$@"' >> ~/.local/bin/fvm
          echo 'else' >> ~/.local/bin/fvm
          echo '  echo "Unsupported fvm command: $1"' >> ~/.local/bin/fvm
          echo '  exit 1' >> ~/.local/bin/fvm
          echo 'fi' >> ~/.local/bin/fvm
          chmod +x ~/.local/bin/fvm
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify FVM
        run: |
          fvm flutter --version
          fvm dart --version

      - name: Install Patrol CLI
        run: |
          # 4.6.1+ required with SPM: older CLIs pass PATROL_ENABLED via OTHER_SWIFT_FLAGS,
          # which never reaches the patrol Swift package — tests silently compile to stubs.
          dart pub global activate patrol_cli 4.6.1
          patrol --version

      - name: Setup Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

          echo "storeFile=keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}" >> android/key.properties
          cat android/key.properties

      - name: Set up XCode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app

      - name: Install Codemagic CLI tools
        run: |
          python -m pip install codemagic-cli-tools
          codemagic-cli-tools version
          codemagic-cli-tools installed-tools

      - name: Set up keychain
        run: |
          keychain initialize
          keychain get-default

      # iOS signing (distribution cert + provisioning profiles) is provided
      # entirely by the step below via App Store Connect. The previous
      # curl-from-S3 cert/profile downloads were removed: that bucket
      # (zm-random) no longer exists and returned a 404, which `keychain
      # add-certificates` rejected as "Unknown format".
      # Signing files are imported to keychain from:
      #  ls -la ~/Library/MobileDevice/Provisioning\ Profiles
      #  ls -la ~/Library/MobileDevice/Certificates/
      - name: Fetch signing files
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APPLE_APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect fetch-signing-files "com.mysteriumvpn.test" --platform IOS --type IOS_APP_STORE --certificate-key "${{ secrets.APPLE_CERTIFICATE_PRIVATE_KEY }}" --create
          # The XCUITest runner is a separate bundle id, so `use-profiles` (below)
          # needs its own profile in the keychain to map onto that target —
          # otherwise its committed placeholder specifier is left unresolved.
          # It must be a DEVELOPMENT profile: Xcode auto-injects the get-task-allow
          # entitlement for UI-test bundles, which only development profiles carry
          # (an App Store/distribution profile fails with "get-task-allow not found").
          app-store-connect fetch-signing-files "com.mysteriumvpn.RunnerUITests" --platform IOS --type IOS_APP_DEVELOPMENT --certificate-key "${{ secrets.APPLE_CERTIFICATE_PRIVATE_KEY }}" --create
          keychain add-certificates

      # ── Fallback: manual iOS signing from GitHub Secrets ──────────────────
      # Use this ONLY if the `Fetch signing files` step above cannot sign
      # standalone from App Store Connect. It mirrors the Android keystore
      # pattern (assets live in repo secrets, not an external host), replacing
      # the deleted zm-random S3 bucket.
      #
      # To enable:
      #   1. Add these repository secrets, base64-encoded:
      #        IOS_CERTIFICATE_P12_BASE64            # base64 of the .p12
      #        IOS_CERTIFICATE_PASSWORD              # the .p12 export password
      #        IOS_PROD_PROVISIONING_PROFILE_BASE64  # base64 of prod.mobileprovision
      #        IOS_TEST_PROVISIONING_PROFILE_BASE64  # base64 of test.mobileprovision
      #      e.g.  base64 -i integration_tests.p12 | pbcopy
      #   2. Comment out the `Fetch signing files` step above.
      #   3. Uncomment the step below.
      #
      # - name: Install iOS signing assets from secrets
      #   run: |
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     echo "${{ secrets.IOS_PROD_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/prod.mobileprovision
      #     echo "${{ secrets.IOS_TEST_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/test.mobileprovision
      #     echo "${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}" | base64 --decode > integration_tests.p12
      #     keychain add-certificates --certificate integration_tests.p12 --certificate-password "${{ secrets.IOS_CERTIFICATE_PASSWORD }}"

      - name: Set up signing preferences on Xcode project
        run: |
          keychain list-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj --export-options-plist ios/export_options.plist
          git status
          git diff
          cat ios/export_options.plist


      - name: Install dependencies
        run: make init

      - name: 'Build iOS test app'
        run: make build-ios-integration-test

      - name: 'Run iOS tests'
        run: |
          MODEL=$(gcloud firebase test ios models list --filter="tags:default" --format="value(id)" | head -1)
          VERSION=$(gcloud firebase test ios versions list --filter="tags:default" --format="value(id)" | head -1)
          echo "iOS Test Lab device: ${MODEL} / ${VERSION}"
          make run-ios-testlab IOS_DEVICE_MODEL="${MODEL}" IOS_DEVICE_VERSION="${VERSION}"

      - name: 'Build Android test app'
        # NOTE: device_flows_test (real VPN tunnel) is intentionally NOT enabled
        # here — the Android Test Lab device is MediumPhone.arm, a *virtual*
        # device that can't establish a tunnel (would run-and-fail, not skip).
        # To run them on Android, switch ANDROID_DEVICE_MODEL to a physical
        # device (e.g. shiba/Pixel 8) and add flags="--dart-define DEVICE_TESTS=true".
        run: make build-android-integration-test

      - name: 'Run Android tests'
        run: make run-android-testlab
