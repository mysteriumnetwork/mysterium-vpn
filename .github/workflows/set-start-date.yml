name: Set Start Date for Issues

on:
  issues:
    types: [labeled]

jobs:
  set-start-date:
    runs-on: ubuntu-latest
    steps:
      - name: Check if the issue is moved to "In Progress"
        if: ${{ github.event.label.name == 'In Progress' }}
        run: echo "Issue moved to 'In Progress'"

      - name: Set Start Date
        if: ${{ github.event.label.name == 'In Progress' }}
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const now = new Date().toISOString();

            const issue = await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              body: `${context.payload.issue.body}\n\n**Started on:** ${now}`
            });

            core.info(`Start date set for issue #${issue_number}`);
