on:
  workflow_call:
    inputs:
      build_version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      package_name:
        required: true
        type: string
      package_track:
        required: true
        type: string
      package_status:
        required: true
        type: string
        default: "completed"
      flavor:
        required: true
        type: string
        default: "dev"
      env_file:
        required: true
        type: string
        default: ".env.dev"

jobs:

  # Android Build
  # Based on documentation https://docs.flutter.dev/deployment/android#sign-the-app
  # And tutorial at https://medium.com/lodgify-technology-blog/deploy-your-flutter-app-to-google-play-with-github-actions-f13a11c4492e
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17.x"
          cache: "gradle"

      - name: Materialize .env files from repo secrets
        shell: bash
        env:
          ENV_DEV: ${{ secrets.ENV_DEV }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ENV_E2E: ${{ secrets.ENV_E2E }}
        run: bash .github/scripts/materialize-envs.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        # Enable caching on feature branches
        #with:
        #  cache-read-only: false

      - name: Setup Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0

      - name: Install Flutter SDK
        run: echo yes | fvm use

      - name: Print Flutter SDK version
        run: fvm flutter --version

      - name: Setup keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

          echo "storeFile=keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}" >> android/key.properties
          cat android/key.properties

      - name: Install dependencies
        run: make init

      - name: Replace version
        run: |
          fvm dart run cider version "${{ inputs.build_version }}+${{ inputs.build_number }}"
          git diff

      - name: Configure Gradle to use Maven Central
        run: |
          mkdir -p ~/.gradle
          cp android/init.gradle ~/.gradle/init.gradle

      - name: Build Android app
        run: |
          fvm flutter build apk --config-only --flavor "${{ inputs.flavor }}" --dart-define-from-file="${{ inputs.env_file }}"
          fvm flutter build appbundle --no-pub --release --flavor "${{ inputs.flavor }}" --dart-define-from-file="${{ inputs.env_file }}"

      - name: Authenticate to Play Store
        id: google-play-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.ANDROID_GCLOUD_SERVICE_ACCOUNT_CREDENTIALS_BASE64 }}
      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          releaseFiles: build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab
          mappingFile: build/app/outputs/mapping/${{ inputs.flavor }}Release/mapping.txt
          serviceAccountJson: ${{ steps.google-play-auth.outputs.credentials_file_path }}
          packageName: ${{ inputs.package_name }}
          track: ${{ inputs.package_track }}
          status: ${{ inputs.package_status }}

      - name: Post Setup keystore
        run: rm android/app/keystore.jks android/key.properties
        if: always()
