on:
  workflow_call:
    inputs:
      build_version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      application_name:
        required: true
        type: string
        default: "Mysterium VPN Test"
      application_logo:
        required: true
        type: string
        default: "assets/logo/dev/desktop.png"
      env_file:
        required: true
        type: string
        default: ".env.dev"
      standalone_keyvault_certificate:
        required: true
        type: string
      protocol_activation:
        required: true
        type: string

jobs:
  release:
    name: Build & Publish
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Materialize .env files from repo secrets
        shell: bash
        env:
          ENV_DEV: ${{ secrets.ENV_DEV }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ENV_E2E: ${{ secrets.ENV_E2E }}
        run: bash .github/scripts/materialize-envs.sh

      - name: Install yq using Chocolatey
        run: choco install yq -y
      - run: dotnet tool install --global AzureSignTool

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter Version Management CLI
        shell: pwsh
        run: |
          dart pub global activate fvm
          echo "$env:LOCALAPPDATA\Pub\Cache\bin" >> $env:GITHUB_PATH

      - name: Install Flutter SDK
        run: echo yes | fvm use

      - name: Print Flutter SDK version
        run: fvm flutter --version

      - name: Install dependencies
        run: make init

      - name: Replace version
        run: |
          fvm dart run cider version "${{ inputs.build_version }}+${{ inputs.build_number }}"
          git diff

      - name: Build Windows app
        run: fvm flutter build windows --no-pub --release --dart-define-from-file="${{ inputs.env_file }}"

      - name: Build Windows installer
        shell: pwsh
        run: |
          Install-Module -Name Az.KeyVault -Scope CurrentUser -Force 
          Connect-AzAccount -ServicePrincipal `
            -TenantId "${{ vars.MICROSOFT_AZURE_SIGNING_TENANT_ID }}" `
            -Credential (New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList "${{ vars.MICROSOFT_AZURE_SIGNING_CLIENT_ID }}", (ConvertTo-SecureString -String "${{ secrets.MICROSOFT_AZURE_SIGNING_CLIENT_SECRET }}" -AsPlainText -Force));
          $certificate_publisher = (Get-AzKeyVaultCertificate -VaultName "${{ vars.MICROSOFT_AZURE_KEYVAULT_NAME }}" -Name "${{ inputs.standalone_keyvault_certificate }}").Certificate.Subject
          
          fvm dart run msix:create `
            --build-windows false --install-certificate false --output-name "MysteriumVPN" `
            --display-name "${{ inputs.application_name }}" --logo-path "${{ inputs.application_logo }}" `
            --sign-msix false --publisher "$certificate_publisher" --protocol-activation "${{ inputs.protocol_activation }}"

      - name: Sign Windows Installer (GlobalSign HSM certificate in Azure Key Vault)
        run: |
          AzureSignTool sign `
            -kvu ${{ vars.MICROSOFT_AZURE_KEYVAULT_URL }} `
            -kvt ${{ vars.MICROSOFT_AZURE_SIGNING_TENANT_ID }} `
            -kvi ${{ vars.MICROSOFT_AZURE_SIGNING_CLIENT_ID }} `
            -kvs ${{ secrets.MICROSOFT_AZURE_SIGNING_CLIENT_SECRET }} `
            -kvc ${{ inputs.standalone_keyvault_certificate }} `
            -tr http://timestamp.globalsign.com/tsa/advanced `
            -td sha256 `
            -fd sha256 `
            "build/windows/x64/runner/Release/MysteriumVPN.msix"
      - name: Sign Windows installer (Azure Trusted Signing)
        if: false
        uses: azure/trusted-signing-action@v0.5.10
        with:
          azure-tenant-id: ${{ vars.MICROSOFT_AZURE_AD_TENANT_ID }}
          azure-client-id: ${{ vars.MICROSOFT_AZURE_SIGNING_ClIENT_ID }}
          azure-client-secret: ${{ secrets.MICROSOFT_AZURE_SIGNING_ClIENT_SECRET }}
          endpoint: https://neu.codesigning.azure.net/
          trusted-signing-account-name: ${{ vars.MICROSOFT_AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.MICROSOFT_AZURE_SIGNING_PROFILE_NAME }}
          files-folder: build/windows/x64/runner/Release
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: true

      - name: Upload to Github
        uses: actions/upload-artifact@v5
        with:
          name: Windows app (Standalone)
          path: build/windows/x64/runner/Release/MysteriumVPN.msix
          if-no-files-found: error

