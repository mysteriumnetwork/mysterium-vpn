on:
  workflow_call:
    inputs:
      build_version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      flavor_dart:
        required: true
        type: string
        default: "DEV"

jobs:

  release:
    name: Build & Publish
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install yq using Chocolatey
        run: choco install yq -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Replace version
        run: |
          dart run cider version "${{ inputs.build_version }}+${{ inputs.build_number }}"
          git diff

      - name: Build Windows app
        run: flutter build windows --no-pub --release --dart-define "FLAVOR=${{ inputs.flavor_dart }}"

      - name: Build Windows installer
        run: |
          dart run msix:create `
            --build-windows false --install-certificate false --output-name "Mysterium VPN" `
            --display-name "Mysterium VPN Test" --logo-path "assets/logo/dev/desktop.png" `
            --sign-msix false --publisher CN="UAB MN Technologijos, O=UAB MN Technologijos, STREET=Konstitucijos pr. 21A, PostalCode=LT-08105, L=Vilnius, S=Vilniaus apskritis, C=LT, SERIALNUMBER=304869871, OID.1.3.6.1.4.1.311.60.2.1.3=LT, OID.2.5.4.15=Private Organization"

      - name: Upload to Github
        uses: actions/upload-artifact@v3
        with:
          name: Windows app (Standalone)
          path: |
            build/windows/x64/runner/Release/mysterium_vpn.exe
            build/windows/x64/runner/Release/Mysterium VPN.msix
          if-no-files-found: error

      - name: Build Windows installer
        run: |
          dart run msix:create `
            --build-windows false --install-certificate false --output-name "Mysterium VPN" `
            --display-name "Mysterium VPN Test" --logo-path "assets/logo/dev/desktop.png" `
            --store --identity-name "UABMNTechnologijos.MysteriumVPNTest" --publisher "CN=B6C98289-B62E-4315-9F65-9B59DB0FC5AC" --publisher-display-name "UAB MN Technologijos"

      - name: Upload to Github
        uses: actions/upload-artifact@v3
        with:
          name: Windows app (Store)
          path: |
            build/windows/x64/runner/Release/mysterium_vpn.exe
            build/windows/x64/runner/Release/Mysterium VPN.msix
          if-no-files-found: error

      - name: Download Microsoft Store Developer CLI
        uses: microsoft/setup-msstore-cli@v1
      - name: Setup Microsoft Store Developer CLI
        run: |
          msstore reconfigure --tenantId "${{ vars.MICROSOFT_AZURE_AD_TENANT_ID }}" --clientId "${{ vars.MICROSOFT_AZURE_AD_ClIENT_ID }}" --clientSecret "${{ secrets.MICROSOFT_AZURE_AD_CLIENT_SECRET }}" --sellerId "${{ vars.MICROSOFT_PARTNER_CENTER_SELLER_ID }}"
          msstore info
      - name: Publish to Microsoft Store
        run: msstore publish --inputDirectory "build/windows/x64/runner/Release" --appId 9MZRX8P6FXC4 --noCommit