on:
  workflow_call:
    inputs:
      build_version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      bundle_id:
        required: true
        type: string
      product_name:
        required: true
        type: string
        default: "Mysterium VPN Test"
      flavor:
        required: true
        type: string
        default: "dev"
      env_file:
        required: true
        type: string
        default: ".env.dev"

jobs:
  release:
    name: Build & Publish
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Replace Git URL in pubspec.yaml with PAT
        run: |
          sed -i.bak "s|git@github.com:mysteriumnetwork/openvpn_dart.git|https://${GITHUB_PAT}@github.com/mysteriumnetwork/openvpn_dart.git|g" pubspec.yaml
          rm -f pubspec.yaml.bak
        env:
          GITHUB_PAT: ${{ secrets.OVPN_GITHUB_PAT }}

      - name: Set up XCode
        run: sudo xcode-select --switch /Applications/Xcode_16.1.0.app

      - name: Setup Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0

      - name: Install Flutter SDK
        run: echo yes | fvm use

      - name: Print Flutter SDK version
        run: fvm flutter --version

      - name: Install Codemagic CLI tools
        run: |
          python -m pip install codemagic-cli-tools
          codemagic-cli-tools version
          codemagic-cli-tools installed-tools

      - name: Set up keychain
        run: |
          keychain initialize
          keychain get-default

      - name: Fetch signing files
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APPLE_APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect fetch-signing-files "${{ inputs.bundle_id }}" --platform MAC_OS --type MAC_APP_STORE --certificate-key "${{ secrets.APPLE_CERTIFICATE_PRIVATE_KEY }}" --create
          keychain add-certificates

      - name: Fetch Installer Distribution certificates
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APPLE_APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect certificates list --type MAC_INSTALLER_DISTRIBUTION --certificate-key "${{ secrets.APPLE_CERTIFICATE_PRIVATE_KEY }}" --save \
          || app-store-connect certificates create --type MAC_INSTALLER_DISTRIBUTION --certificate-key "${{ secrets.APPLE_CERTIFICATE_PRIVATE_KEY }}" --save
          keychain add-certificates

      - name: Set up signing preferences on Xcode project
        run: |
          keychain list-certificates
          xcode-project use-profiles --project macos/Runner.xcodeproj --export-options-plist macos/export_options.plist
          git status
          git diff

      - name: Install dependencies
        run: make init

      - name: Replace version
        run: |
          fvm dart run cider version "${{ inputs.build_version }}+${{ inputs.build_number }}"
          git diff

      - name: Build macOS app
        run: fvm flutter build macos --no-pub --release --flavor "${{ inputs.flavor }}" --dart-define-from-file="${{ inputs.env_file }}"

      # ✅ Improved Signing + Bonus Diagnostic Section
      - name: Build macOS installer
        working-directory: build/macos/Build/Products/Release-${{ inputs.flavor }}
        run: |
          echo "🔐 Unlocking keychain..."
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$(keychain get-default)"

          echo "📋 Available identities:"
          security find-identity -v -p codesigning

          echo "📦 Creating unsigned installer..."
          xcrun productbuild --component "${{ inputs.product_name }}.app" /Applications/ unsigned.pkg

          echo "🔍 Detecting correct signing identity..."
          SIGN_IDENTITY=$(keychain list-certificates | jq '[.[] | select(.common_name | test("Developer ID Installer|3rd Party Mac Developer Installer")) | .common_name][0]' | xargs)

          if [ -z "$SIGN_IDENTITY" ]; then
            echo "❌ No suitable Mac Installer signing identity found."
            echo "Please ensure a 'Developer ID Installer' or '3rd Party Mac Developer Installer' certificate is installed."
            exit 1
          fi

          echo "✅ Using signing identity: $SIGN_IDENTITY"
          xcrun productsign --sign "$SIGN_IDENTITY" unsigned.pkg "Mysterium VPN.pkg"

          echo "🔏 Verifying signature..."
          pkgutil --check-signature "Mysterium VPN.pkg"

      - name: Publish to Apple Store
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APPLE_APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect publish --path "build/macos/Build/Products/Release-${{ inputs.flavor }}/Mysterium VPN.pkg" --platform MAC_OS

      - name: Post Set up keychain
        if: always()
        run: |
          keychain delete
          keychain use-login
          keychain list-certificates
