on:
  workflow_call:
    inputs:
      build_version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      bundle_id:
        required: true
        type: string
      product_name:
        required: true
        type: string
        default: "Mysterium VPN Test"
      flavor:
        required: true
        type: string
        default: "dev"
      env_file:
        required: true
        type: string
        default: ".env.dev"

jobs:
  release:
    name: Build & Publish (App Store Only)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up XCode
        run: sudo xcode-select --switch /Applications/Xcode_16.1.0.app

      - name: Setup Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0

      - name: Install Flutter SDK
        run: echo yes | fvm use

      - name: Print Flutter SDK version
        run: fvm flutter --version

      - name: Install Codemagic CLI tools
        run: |
          python -m pip install codemagic-cli-tools
          codemagic-cli-tools version
          codemagic-cli-tools installed-tools

      - name: Set up keychain
        run: |
          keychain initialize
          keychain get-default

      - name: Fetch App Store signing files
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APPLE_APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect fetch-signing-files "${{ inputs.bundle_id }}" \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --certificate-key "${{ secrets.APPLE_CERTIFICATE_PRIVATE_KEY }}" \
            --create
          keychain add-certificates

      - name: Set up signing preferences on Xcode project
        run: |
          keychain list-certificates
          xcode-project use-profiles \
            --project macos/Runner.xcodeproj \
            --export-options-plist macos/export_options.plist

      - name: Install dependencies
        run: make init

      - name: Replace version
        run: |
          fvm dart run cider version "${{ inputs.build_version }}+${{ inputs.build_number }}"
          git diff

      - name: Build macOS app
        run: |
          fvm flutter build macos \
            --no-pub \
            --release \
            --flavor "${{ inputs.flavor }}" \
            --dart-define-from-file="${{ inputs.env_file }}"

      - name: Build signed macOS installer
        working-directory: build/macos/Build/Products/Release-${{ inputs.flavor }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          CERT_P12: ${{ secrets.CERT_P12 }} # base64-encoded P12 of 3rd Party Mac Developer Installer
        run: |
          set -euo pipefail
          echo "=== Starting macOS installer build ==="

          # --- Setup temporary keychain ---
          echo "Creating temporary keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -s ~/Library/Keychains/build.keychain

          # --- Import certificate ---
          echo "Importing installer certificate..."
          echo "$CERT_P12" | base64 --decode > installer_cert.p12
          security import installer_cert.p12 -k ~/Library/Keychains/build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm installer_cert.p12

          # --- Verify certificates installed ---
          echo "Listing installer certificates..."
          security find-identity -v -p installer

          # --- Pick 3rd Party Mac Developer Installer certificate ---
          INSTALLER_CERT=$(security find-identity -v -p installer | grep "3rd Party Mac Developer Installer" | head -n1 | awk -F '"' '{print $2}')
          echo "Installer certificate selected: '$INSTALLER_CERT'"

          if [ -z "$INSTALLER_CERT" ]; then
            echo "ERROR: No 3rd Party Mac Developer Installer certificate found!"
            exit 1
          fi

          # --- Build unsigned pkg ---
          echo "Building unsigned pkg..."
          xcrun productbuild --component "${{ inputs.product_name }}.app" /Applications/ unsigned.pkg
          echo "Unsigned pkg created."

          # --- Verify unsigned pkg exists ---
          if [ ! -f unsigned.pkg ]; then
            echo "ERROR: unsigned.pkg was not created!"
            exit 1
          fi

          # --- Sign the pkg ---
          echo "Signing pkg with certificate..."
          xcrun productsign --sign "$INSTALLER_CERT" unsigned.pkg "${{ inputs.product_name }}.pkg"

          # --- Verify signed pkg exists ---
          if [ ! -f "${{ inputs.product_name }}.pkg" ]; then
            echo "ERROR: Signed pkg was not created!"
            exit 1
          fi

          # --- Verify signature ---
          echo "Verifying pkg signature..."
          pkgutil --check-signature "${{ inputs.product_name }}.pkg"

          echo "=== macOS installer build complete ==="

      - name: Publish to Apple Store
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APPLE_APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect publish \
            --path "build/macos/Build/Products/Release-${{ inputs.flavor }}/${{ inputs.product_name }}.pkg" \
            --platform MAC_OS

      - name: Clean up keychain
        if: always()
        run: |
          keychain delete
          keychain use-login
          keychain list-certificates
