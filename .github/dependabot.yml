version: 2
updates:
  # Keep Dart dependencies up to date (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(pub)"
      include: "scope"
    reviewers:
      - KristijanMitrik
      - dmacan23
    ignore:
      # vpn_api is ignored because it is a private dependency that requires manual updates.
      - dependency-name: "vpn_api"
  - package-ecosystem: gradle
    directory: "android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(android)"
    reviewers:
      - KristijanMitrik
      - dmacan23

  # Keep GitHub Actions workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    reviewers:
      - KristijanMitrik
      - dmacan23
