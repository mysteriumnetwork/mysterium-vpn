flutter_icons:
  image_path_android: "assets/logo/playstore.png"
  image_path_ios: "assets/logo/appstore.png"
  android: true
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#2C2A47"
  adaptive_icon_foreground: "assets/logo/playstore.png"
  windows:
    generate: true
    image_path: "assets/logo/playstore.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo/appstore.png"