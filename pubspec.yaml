  mobx: 2.6.0
  money2: 6.3.0
  mqtt5_client: 5.0.0
  mysterium_vpn_design:
    git:
      url: https://github.com/mysteriumnetwork/mysterium-vpn-design.git
      ref: feat/favourite-ips
  onesignal_flutter: 5.6.6
  open_store: 0.5.0
  openvpn_dart:
    git:
      url: https://github.com/mysteriumnetwork/openvpn_dart.git
      ref: 0.0.9
  package_info_plus: 10.2.1
  reactive_forms: 17.0.1
  retry: 3.1.2
  sentry_flutter: 9.25.0
  shared_preferences: 2.5.5
  shimmer: 3.0.0
  showcaseview: 5.0.2
  sign_in_with_apple: 8.1.0
  sliver_tools: 0.2.12
  stack_trace: 1.12.1
  store_checker_windows:
    path: ./packages/store_checker_windows
  talker: 5.1.19
  talker_dio_logger: 5.1.19
  tray_manager: 0.5.3
  url_launcher: 6.3.2
  url_protocol:
    git:
      url: https://github.com/KristijanMitrik/flutter_url_protocol
      ref: main
  vpn_api:
    git:
      url: https://github.com/mysteriumnetwork/mysterium-vpn-api-client-dart.git
      ref: 1.0.81
  webview_flutter: 4.14.1
  window_manager: 0.5.2
  wireguard_dart:
    git:
      url: https://github.com/mysteriumnetwork/wireguard_dart.git
      ref: 0.9.13

dev_dependencies:
  build: ^4.0.0
  build_runner: 2.13.0
  cider: 0.2.10
  flutter_gen_runner: 5.13.0+1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  hive_ce_generator: 1.11.0
  integration_test:
    sdk: flutter
  intl_utils: ^2.8.10
  json_serializable: 6.13.0
  mobx_codegen: 2.7.7
  mockito: 5.6.4
  msix: 3.18.0
  patrol: 4.8.0
  plugin_platform_interface: 2.1.8
  url_launcher_platform_interface: 2.3.2

dependency_overrides:
  # mockito >=5.6.5 needs analyzer ^13, incompatible with mobx_codegen 2.7.7 (analyzer <13).
  # Override needed because wireguard_dart wrongly ships mockito 5.7.0 as a regular
  # dependency — drop this once wireguard_dart moves it to dev_dependencies.
  mockito: 5.6.4

msix_config:
  display_name: Mysterium VPN
  publisher_display_name: UAB MN Technologijos
  logo_path: assets/logo/prod/desktop.png
  language: en-us
  capabilities: runFullTrust, allowElevation, internetClient
  protocol_activation: mysteriumvpn
  override_executable: mysterium_vpn.exe

flutter_intl:
  enabled: false
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated
  use_deferred_loading: false
  localizely:
    project_id: c88d61d8-c2db-4b19-b798-7ab447a7b762
    ota_enabled: true

