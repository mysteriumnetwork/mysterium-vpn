name: mysterium_vpn
description: Next-gen Mysterium VPN client for mobile (iOS/Android) and desktop (Windows/MacOS/Linux).

publish_to: 'none'
version: 1.1.6+16

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  app_links: ^3.4.2
  auto_size_text: ^3.0.0
  beamer: ^1.5.3
  circle_flags: ^1.0.3
  collection: ^1.16.0
  connectivity_plus: ^3.0.3
  cupertino_icons: ^1.0.2
  dio: ^5.0.1
  easy_localization: ^3.0.1
  firebase_analytics: ^10.1.6
  firebase_core: ^2.8.0
  firebase_crashlytics: ^3.0.17
  flutter:
    sdk: flutter
  flutter_hooks: ^0.18.5+1
  flutter_launcher_icons: ^0.12.0
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.0.6+5
  flutter_native_splash: ^2.2.17
  flutter_secure_storage: ^8.0.0
  flutter_svg: ^1.1.6
  freezed_annotation: ^2.2.0
  google_fonts: ^3.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.1.3
  import_sorter: ^4.6.0
  in_app_purchase: ^3.1.5
  intl: ^0.17.0
  json_annotation: ^4.8.0
  lottie: ^2.2.0
  mobx: ^2.1.3
  modal_bottom_sheet: ^3.0.0-pre
  package_info_plus: ^3.0.2
  path_provider: ^2.0.13
  reactive_forms: ^14.1.0
  shared_preferences: ^2.0.18
  shimmer: ^2.0.0
  sliding_up_panel: ^2.0.0+1
  stack_trace: ^1.11.0
  styled_widget: ^0.4.1
  url_launcher: ^6.1.10
  url_protocol: 
    git:
      url: https://github.com/KristijanMitrik/flutter_url_protocol
      ref: main
  wireguard_dart:
    git:
      url: https://github.com/mysteriumnetwork/wireguard_dart.git
      ref: 0.4.0
  
  


dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.3.2
  hive_generator: ^2.0.0
  json_serializable: ^6.6.0
  mobx_codegen: ^2.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icons/
    - assets/images/
    - assets/flags/
    - assets/animations/
    - resources/langs/

