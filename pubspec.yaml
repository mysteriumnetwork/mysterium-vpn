name: mysterium_vpn
description: Next-gen Mysterium VPN client for mobile (iOS/Android) and desktop (Windows/MacOS/Linux).

publish_to: 'none'
version: 1.4.8+51

environment:
  sdk: '^3.0.0'
  flutter: ">=3.7.0"

dependencies:
  app_links: ^3.4.3
  appsflyer_sdk: ^6.10.3
  async: ^2.10.0
  auto_size_text: ^3.0.0
  beamer: ^1.5.5
  circle_flags: ^1.0.3
  collection: ^1.17.1
  connectivity_plus: ^4.0.1
  crypto: ^3.0.3
  cupertino_icons: ^1.0.2
  dio: ^5.2.0+1
  easy_localization: ^3.0.2
  firebase_analytics: ^10.4.2
  firebase_core: ^2.13.1
  firebase_crashlytics: ^3.3.2
  firebase_performance: ^0.9.2+2
  flutter:
    sdk: flutter
  flutter_hooks: ^0.18.6
  flutter_launcher_icons: ^0.13.1
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.0.6+5
  flutter_native_splash: ^2.2.17
  flutter_secure_storage: ^8.0.0
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.6
  freezed_annotation: ^2.2.0
  google_fonts: ^4.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.1.3
  import_sorter: ^4.6.0
  in_app_purchase: ^3.1.7
  in_app_review: ^2.0.6
  intercom_flutter: ^7.8.0
  intl: ^0.18.0
  json_annotation: ^4.8.0
  lottie: ^2.4.0
  mobx: ^2.1.3
  modal_bottom_sheet: ^3.0.0-pre
  open_mail_app: ^0.4.5
  package_info_plus: ^4.0.1
  path_provider: ^2.0.13
  reactive_forms: ^15.0.0
  sentry_dio: ^7.7.0
  sentry_flutter: ^7.5.1
  shared_preferences: ^2.0.18
  shimmer: ^2.0.0
  sliding_up_panel: ^2.0.0+1
  stack_trace: ^1.11.0
  styled_widget: ^0.4.1
  tray_manager: ^0.2.0
  url_launcher: ^6.1.10
  url_protocol: 
    git:
      url: https://github.com/KristijanMitrik/flutter_url_protocol
      ref: main
  window_manager: ^0.3.5
  wireguard_dart:
    git:
      url: https://github.com/mysteriumnetwork/wireguard_dart.git
      ref: 0.4.4
  
  


dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.3.2
  hive_generator: ^2.0.0
  json_serializable: ^6.6.0
  mobx_codegen: ^2.1.1
  msix: ^3.15.1

msix_config:
  display_name: Mysterium VPN Test
  publisher_display_name: UAB MN Technologijos
  logo_path: assets/logo/dev/desktop.png
  identity_name: UABMNTechnologijos.MysteriumVPNTest
  publisher: CN=B6C98289-B62E-4315-9F65-9B59DB0FC5AC
  output_name: MysteriumVPNTest
  language: en-us
  windows_build_args: --dart-define FLAVOR=DEV
  store: true
  capabilities: runFullTrust, allowElevation, internetClient
  protocol_activation: mysteriumvpn

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/logo/dev/
    - assets/logo/prod/
    - assets/icons/
    - assets/images/
    - assets/flags/
    - assets/animations/
    - resources/langs/

