name: mysterium_vpn
description: Next-gen Mysterium VPN client for mobile (iOS/Android) and desktop (Windows/MacOS/Linux).

publish_to: "none"
version: 1.9.6-dev

environment:
  sdk: "^3.0.0"
  flutter: 3.27.3

dependencies:
  app_links: 6.3.3
  async: 2.11.0
  auto_size_text: 3.0.0
  beamer: 1.7.0
  circle_flags: 5.0.0
  clipboard: 0.1.3
  collection: 1.19.0
  configcat_client: 4.1.1
  connectivity_plus: 6.0.5
  crypto: 3.0.5
  cupertino_icons: 1.0.8
  dio: 5.6.0
  easy_localization: 3.0.7
  easy_localization_loader: ^2.0.2
  firebase_analytics: 11.4.1
  firebase_core: 3.10.1
  firebase_crashlytics: 4.3.1
  firebase_performance: 0.10.1+1
  flutter:
    sdk: flutter
  flutter_hooks: 0.20.5
  flutter_launcher_icons: 0.13.1
  flutter_localizations:
    sdk: flutter
  flutter_mobx: 2.2.1+1
  flutter_native_splash: 2.4.1
  flutter_portal: ^1.1.4
  flutter_secure_storage: 9.2.4
  flutter_spinkit: 5.2.1
  flutter_svg: 2.0.17
  freezed_annotation: 2.4.4
  google_fonts: 6.2.1
  google_sign_in: 6.2.2
  hive: 2.2.3
  hive_flutter: 1.1.0
  hooks_riverpod: 2.6.1
  in_app_purchase: 3.1.13
  in_app_purchase_storekit: 0.3.18+1
  in_app_review: 2.0.10
  intercom_flutter: ^9.2.5
  intl: 0.19.0
  json_annotation: 4.9.0
  lottie: 3.3.1
  mobx: 2.3.3+2
  modal_bottom_sheet: 3.0.0
  mqtt_client: ^10.5.1
  open_mail_app:
    git:
      url: https://github.com/KristijanMitrik/open-mail-app-flutter.git
      ref: upgrade-dependencies
  open_store: 0.5.0
  package_info_plus: 8.1.4
  path_provider: 2.1.5
  reactive_forms: 17.0.1
  sentry_flutter: 8.12.0
  shared_preferences: 2.5.1
  shimmer: 3.0.0
  sign_in_with_apple: 6.1.4
  sliding_up_panel: 2.0.0+1
  sliver_tools: ^0.2.12
  stack_trace: 1.12.0
  store_checker_windows:
    path: ./packages/store_checker_windows
  storekit_extensions:
    path: ./packages/storekit_extensions
  styled_widget: 0.4.1
  talker: 4.4.1
  talker_dio_logger: 4.4.1
  tray_manager: 0.3.2
  url_launcher: 6.3.0
  url_protocol:
    git:
      url: https://github.com/KristijanMitrik/flutter_url_protocol
      ref: main
  vpn_api:
    path: packages/vpn_api
  window_manager: 0.4.3
  wireguard_dart:
    git:
      url: https://github.com/mysteriumnetwork/wireguard_dart.git
      ref: 0.9.1

dev_dependencies:
  build_runner: 2.4.12
  cider: 0.2.8
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
  freezed: 2.5.7
  hive_generator: ^2.0.1
  json_serializable: 6.8.0
  mobx_codegen: 2.6.1
  msix: 3.16.8

msix_config:
  display_name: Mysterium VPN
  publisher_display_name: UAB MN Technologijos
  logo_path: assets/logo/prod/desktop.png
  language: en-us
  capabilities: runFullTrust, allowElevation, internetClient
  protocol_activation: mysteriumvpn

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/logo/dev/
    - assets/logo/prod/
    - assets/icons/
    - assets/images/
    - assets/flags/
    - assets/animations/
    - resources/langs/
    - assets/google_fonts/
