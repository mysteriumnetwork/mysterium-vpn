name: mysterium_vpn
description: Next-gen Mysterium VPN client for mobile (iOS/Android) and desktop (Windows/MacOS/Linux).

publish_to: 'none'
version: 1.6.9+99

environment:
  sdk: '^3.0.0'
  flutter: ">=3.7.0"

dependencies:
  app_links: ^6.0.2
  appsflyer_sdk: ^6.14.3
  async: ^2.11.0
  auto_size_text: ^3.0.0
  beamer: ^1.6.1
  circle_flags: ^3.0.1
  clipboard: ^0.1.3
  collection: ^1.18.0
  connectivity_plus: ^5.0.2
  crypto: ^3.0.3
  cupertino_icons: ^1.0.2
  dart_ping: ^9.0.1
  dart_ping_ios: ^4.0.2
  dio: ^5.4.3+1
  easy_localization: ^3.0.7
  firebase_analytics: ^11.2.1
  firebase_core: ^3.3.0
  firebase_crashlytics: ^4.0.4
  firebase_performance: ^0.10.0+4
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  flutter_launcher_icons: ^0.13.1
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.2.0+2
  flutter_native_splash: ^2.4.0
  flutter_secure_storage: ^9.1.1
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.4.10
  import_sorter: ^4.6.0
  in_app_purchase: ^3.2.0
  in_app_purchase_storekit: ^0.3.15
  in_app_review: ^2.0.9
  intercom_flutter: ^9.0.4
  intl: ^0.19.0
  json_annotation: ^4.9.0
  lottie: ^3.1.1
  mobx: ^2.3.0+1
  modal_bottom_sheet: ^3.0.0
  open_mail_app:
    git:
        url: https://github.com/KristijanMitrik/open-mail-app-flutter.git
        ref: upgrade-dependencies
  package_info_plus: ^8.0.0
  path_provider: ^2.1.3
  reactive_forms: ^16.1.1
  sentry_flutter: ^8.2.0
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  sign_in_with_apple: ^6.1.0
  sliding_up_panel: ^2.0.0+1
  stack_trace: ^1.11.0
  styled_widget: ^0.4.1
  talker: ^4.2.0
  talker_dio_logger: ^4.2.0
  tray_manager: ^0.2.2
  url_launcher: ^6.2.6
  url_protocol:
    git:
      url: https://github.com/KristijanMitrik/flutter_url_protocol
      ref: main
  window_manager: ^0.3.8
  wireguard_dart:
    git:
      url: https://github.com/mysteriumnetwork/wireguard_dart.git
      ref: 0.6.1

dev_dependencies:
  build_runner: ^2.4.8
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter
  freezed: ^2.3.2
  hive_generator: ^2.0.0
  json_serializable: ^6.7.1
  mobx_codegen: ^2.6.0+1
  msix: ^3.15.1

msix_config:
  display_name: Mysterium VPN Test
  publisher_display_name: UAB MN Technologijos
  logo_path: assets/logo/dev/desktop.png
  identity_name: UABMNTechnologijos.MysteriumVPNTest
  publisher: CN=B6C98289-B62E-4315-9F65-9B59DB0FC5AC
  output_name: MysteriumVPNTest
  language: en-us
  windows_build_args: --dart-define FLAVOR=DEV
  store: true
  capabilities: runFullTrust, allowElevation, internetClient
  protocol_activation: mysteriumvpn

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/logo/dev/
    - assets/logo/prod/
    - assets/icons/
    - assets/images/
    - assets/flags/
    - assets/animations/
    - resources/langs/
