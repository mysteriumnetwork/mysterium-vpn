  firebase_core: 4.13.0
  firebase_crashlytics: 5.2.7
  firebase_performance: 0.11.4+6
  flutter:
    sdk: flutter
  flutter_hooks: 0.21.3+1
  flutter_launcher_icons: 0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_map: 8.3.1
  flutter_mobx: 2.3.0
  flutter_native_splash: 2.4.8
  flutter_portal: 1.1.4
