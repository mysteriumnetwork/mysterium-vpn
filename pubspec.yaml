  tray_manager: 0.5.1
  url_launcher: 6.3.2
  url_protocol:
    git:
      url: https://github.com/KristijanMitrik/flutter_url_protocol
      ref: main
  vpn_api:
    git:
      url: https://github.com/mysteriumnetwork/mysterium-vpn-api-client-dart.git
      ref: 1.0.37
  window_manager: 0.5.1
  wireguard_dart:
    git:
      url: https://github.com/mysteriumnetwork/wireguard_dart.git
      ref: 0.9.8

dev_dependencies:
  build_runner: 2.8.0
  cider: 0.2.8
  flutter_gen_runner: 5.12.0
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.3
  hive_ce_generator: 1.9.5
  integration_test:
    sdk: flutter
  json_serializable: 6.11.1
  mobx_codegen: 2.7.4
  mockito: ^5.4.4
  msix: 3.16.12
  patrol: 3.19.0

msix_config:
  display_name: Mysterium VPN
  publisher_display_name: UAB MN Technologijos
  logo_path: assets/logo/prod/desktop.png
  language: en-us
  capabilities: runFullTrust, allowElevation, internetClient
  protocol_activation: mysteriumvpn
  override_executable: mysterium_vpn.exe

