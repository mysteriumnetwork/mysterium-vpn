dev_dependencies:
  build: ^4.0.11
  build_runner: 2.16.2
  cider: 0.2.10
  flutter_gen_runner: 5.13.0+1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  hive_ce_generator: 1.11.3
  integration_test:
    sdk: flutter
  intl_utils: ^2.8.17
  json_serializable: 6.15.2
  mobx_codegen: 2.7.8
  mockito: 5.8.1
  msix: 3.18.0
  patrol: 4.8.0
  plugin_platform_interface: 2.1.8
  url_launcher_platform_interface: 2.3.2

msix_config:
  display_name: Mysterium VPN
  publisher_display_name: UAB MN Technologijos
  logo_path: assets/logo/prod/desktop.png
  language: en-us
  capabilities: runFullTrust, allowElevation, internetClient
  protocol_activation: mysteriumvpn
  override_executable: mysterium_vpn.exe

flutter_intl:
  enabled: false
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated
  use_deferred_loading: false
