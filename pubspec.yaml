name: mysterium_vpn
description: Next-gen Mysterium VPN client for mobile (iOS/Android) and desktop (Windows/MacOS/Linux).

publish_to: "none"
version: 1.7.4+105

environment:
  sdk: "^3.0.0"
  flutter: 3.24.1

dependencies:
  app_links: 6.3.1
  async: 2.11.0
  auto_size_text: 3.0.0
  beamer: 1.6.1
  circle_flags: 5.0.0
  clipboard: 0.1.3
  collection: 1.18.0
  connectivity_plus: 6.0.5
  crypto: 3.0.5
  cupertino_icons: 1.0.8
  dart_ping: 9.0.1
  dart_ping_ios: 4.0.2
  dio: 5.6.0
  easy_localization: 3.0.7
  firebase_analytics: 11.3.0
  firebase_core: 3.4.0
  firebase_crashlytics: 4.1.0
  firebase_performance: 0.10.0+5
  flutter:
    sdk: flutter
  flutter_hooks: 0.20.5
  flutter_launcher_icons: 0.13.1
  flutter_localizations:
    sdk: flutter
  flutter_mobx: 2.2.1+1
  flutter_native_splash: 2.4.1
  flutter_secure_storage: 9.2.2
  flutter_spinkit: 5.2.1
  flutter_svg: 2.0.10+1
  freezed_annotation: 2.4.4
  google_fonts: 6.2.1
  google_sign_in: 6.2.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  hooks_riverpod: 2.5.2
  import_sorter: 4.6.0
  in_app_purchase: 3.2.0
  in_app_purchase_storekit: 0.3.18+1
  in_app_review: 2.0.9
  intercom_flutter: 9.0.9
  intl: 0.19.0
  json_annotation: 4.9.0
  lottie: 3.1.2
  mobx: 2.3.3+2
  modal_bottom_sheet: 3.0.0
  open_mail_app:
    git:
      url: https://github.com/KristijanMitrik/open-mail-app-flutter.git
      ref: upgrade-dependencies
  package_info_plus: 8.0.2
  path_provider: 2.1.4
  reactive_forms: 17.0.1
  sentry_flutter: 8.8.0
  shared_preferences: 2.3.2
  shimmer: 3.0.0
  sign_in_with_apple: 6.1.2
  sliding_up_panel: 2.0.0+1
  stack_trace: 1.11.1
  styled_widget: 0.4.1
  talker: 4.4.1
  talker_dio_logger: 4.4.1
  tray_manager: 0.2.3
  url_launcher: 6.3.0
  url_protocol:
    git:
      url: https://github.com/KristijanMitrik/flutter_url_protocol
      ref: main
  window_manager: 0.4.2
  wireguard_dart:
    git:
      url: https://github.com/mysteriumnetwork/wireguard_dart.git
      ref: 0.7.0

dev_dependencies:
  build_runner: 2.4.12
  cider: 0.2.8
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
  freezed: 2.5.7
  hive_generator: ^2.0.1
  json_serializable: 6.8.0
  mobx_codegen: 2.6.1
  msix: 3.16.8

msix_config:
  display_name: Mysterium VPN Test
  publisher_display_name: UAB MN Technologijos
  logo_path: assets/logo/dev/desktop.png
  identity_name: UABMNTechnologijos.MysteriumVPNTest
  publisher: CN=B6C98289-B62E-4315-9F65-9B59DB0FC5AC
  output_name: MysteriumVPNTest_store
  language: en-us
  windows_build_args: --dart-define FLAVOR=PROD
  store: true
  capabilities: runFullTrust, allowElevation, internetClient
  protocol_activation: mysteriumvpn

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/logo/dev/
    - assets/logo/prod/
    - assets/icons/
    - assets/images/
    - assets/flags/
    - assets/animations/
    - resources/langs/
