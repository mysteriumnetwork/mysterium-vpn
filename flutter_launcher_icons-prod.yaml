flutter_launcher_icons:
  image_path_android: "assets/logo/prod/playstore.png"
  image_path_ios: "assets/logo/prod/appstore.png"
  android: true
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#2C2A47"
  adaptive_icon_foreground: "assets/logo/prod/playstore.png"
  windows:
    generate: true
    image_path: "assets/logo/prod/desktop.png"
    icon_size: 48
  # macOS icons are maintained manually as flavored sets (AppIcon-dev/AppIcon-prod);
  # flutter_launcher_icons can't target flavored macOS appiconsets, so generation is off.
  macos:
    generate: false
